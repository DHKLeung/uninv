<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>uninv - Unified Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="logo">u</span>
          <span class="brand-name">uninv</span>
        </div>
        <nav class="nav-tabs">
          <button type="button" class="nav-tab active">Portfolio</button>
          <button type="button" class="nav-tab disabled" title="Coming soon">Orders</button>
          <button type="button" class="nav-tab disabled" title="Coming soon">Analytics</button>
          <button type="button" class="nav-tab disabled" title="Coming soon">Settings</button>
        </nav>
      </div>

      <div class="topbar-right">
        <span id="as-of" class="as-of-time"></span>
        <div class="currency-picker">
          <label for="currency-select" class="currency-label">Currency</label>
          <select id="currency-select" class="currency-dropdown">
            <option value="USD">USD ($)</option>
            <option value="GBP">GBP (£)</option>
          </select>
        </div>
        <button id="refresh-btn" class="btn btn-primary" type="button">Refresh</button>
      </div>
    </header>

    <main class="app-container">
      <div id="error-banner" class="banner banner-error" hidden></div>

      <!-- Headline KPIs in British English -->
      <section class="kpis">
        <div class="kpi-card">
          <div class="kpi-label">NET LIQUIDATION VALUE</div>
          <div class="kpi-value" id="kpi-netliq">–</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">POSITIONS VALUE</div>
          <div class="kpi-value" id="kpi-positions">–</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">CASH BALANCE</div>
          <div class="kpi-value" id="kpi-cash">–</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">UNREALISED P&amp;L</div>
          <div class="kpi-value" id="kpi-pnl">–</div>
          <div class="kpi-sub" id="kpi-pnl-pct"></div>
        </div>
      </section>

      <!-- Accounts Section -->
      <section class="panel accounts-panel">
        <div class="panel-header">
          <div class="panel-title-group">
            <h2>Accounts</h2>
            <span class="muted" id="accounts-caption"></span>
          </div>
        </div>
        <div id="accounts-grid" class="accounts-grid"></div>
      </section>

      <!-- Positions Section -->
      <section class="panel positions-panel">
        <div class="panel-header positions-header">
          <div class="positions-filter-bar">
            <!-- Account filter buttons (All, IBKR-HK(0728), Futubull-HK(7283)...) -->
            <div id="account-filter-pills" class="filter-pills"></div>
          </div>
          <div class="positions-search-bar">
            <input id="search" type="search" placeholder="Search symbol or instrument…" />
            <span class="positions-count-badge" id="positions-count"></span>
          </div>
        </div>

        <div class="table-wrap">
          <table id="positions-table">
            <thead>
              <tr>
                <th data-sort="instrument">Instrument</th>
                <th data-sort="symbol">Symbol</th>
                <th data-sort="account_alias">Account</th>
                <th data-sort="expiry_date">Expiry Date</th>
                <th data-sort="position" class="num">Position</th>
                <th data-sort="average_price" class="num">Avg Price</th>
                <th data-sort="mark_price" class="num">Mark Price</th>
                <th data-sort="currency" class="num">Currency</th>
                <th data-sort="market_value" class="num">Positions Value</th>
                <th data-sort="unrealised_pnl" class="num">Unrealised P&amp;L</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <div class="statusbar-left">
        <span id="backend-status" class="dot dot-unknown"></span>
        <span id="backend-label" class="muted">Backend: connecting…</span>
      </div>
      <div class="statusbar-right">
        <span class="muted">16:9 Display (1600×900)</span>
      </div>
    </footer>
  </body>
</html>
