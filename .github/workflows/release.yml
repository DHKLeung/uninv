name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            binary_name: "uninv-backend-x86_64-pc-windows-msvc.exe"
            py_target: "uninv-backend.exe"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            binary_name: "uninv-backend-aarch64-apple-darwin"
            py_target: "uninv-backend"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            binary_name: "uninv-backend-x86_64-unknown-linux-gnu"
            py_target: "uninv-backend"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install Python & backend dependencies
        working-directory: backend
        run: |
          uv sync
          uv add --dev pyinstaller

      - name: Package Python backend with PyInstaller
        working-directory: backend
        run: uv run pyinstaller --noconfirm --clean --name uninv-backend --onefile --collect-all uvicorn --collect-all futu --collect-all ib_async entrypoint.py

      - name: Stage sidecar binary for Tauri (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries"
          Copy-Item "backend/dist/${{ matrix.py_target }}" "desktop/src-tauri/binaries/${{ matrix.binary_name }}" -Force

      - name: Stage sidecar binary for Tauri (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp "backend/dist/${{ matrix.py_target }}" "desktop/src-tauri/binaries/${{ matrix.binary_name }}"
          chmod +x "desktop/src-tauri/binaries/${{ matrix.binary_name }}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tauri Desktop Shell & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "uninv ${{ github.ref_name }}"
          releaseBody: "See release notes in release description."
          releaseDraft: false
          prerelease: false
