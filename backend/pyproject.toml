[project]
name = "uninv-backend"
version = "1.2.0"
description = "uninv Python backend: broker connectors and portfolio aggregation served over FastAPI."
readme = "README.md"
authors = [
    { name = "DHKLeung" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "futu-api>=10.12.7208",
    "httpx>=0.28.1",
    "ib-async>=2.1.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# `uv run uninv-backend` starts the API server (see src/uninv_backend/__init__.py).
uninv-backend = "uninv_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
